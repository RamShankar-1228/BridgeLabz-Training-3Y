<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q4.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>Delicious Bites</h1>
        <p class="lead mb-0">Today's Menu</p>
    </header>

    <main class="container py-5">

        <section>

            <div class="table-responsive">
                <table class="table table-striped table-bordered text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>Menu Item</th>
                            <th>Category</th>
                            <th>Price</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Paneer Tikka</td>
                            <td>Starter</td>
                            <td>₹220</td>
                        </tr>

                        <tr>
                            <td>Veg Biryani</td>
                            <td>Main Course</td>
                            <td>₹280</td>
                        </tr>

                        <tr>
                            <td>Butter Naan</td>
                            <td>Bread</td>
                            <td>₹60</td>
                        </tr>

                        <tr>
                            <td>Chocolate Brownie</td>
                            <td>Dessert</td>
                            <td>₹150</td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

        <section class="mt-5">

            <h2 class="text-center mb-3">
                Chef's Specials
            </h2>

            <ul class="list-group">
                <li class="list-group-item">
                    Special Paneer Curry
                </li>

                <li class="list-group-item">
                    Tandoori Platter
                </li>

                <li class="list-group-item">
                    Special Veg Biryani
                </li>
            </ul>

        </section>

        <section class="text-center mt-5">

            <figure>
                <img
                    src=https://blog.resy.com/wp-content/uploads/2026/01/dest-d525f07994a722c7adbf419abfb3e16f27efe7c7-OVDr10notd9QIA0Lm4XzBYIhxeB-2000x1125.jpg
                    class="img-fluid rounded"
                    alt="Restaurant food">

                <figcaption class="mt-2">
                    Freshly prepared food from our kitchen.
                </figcaption>
            </figure>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Delicious Bites</p>
    </footer>

</body>
</html>
