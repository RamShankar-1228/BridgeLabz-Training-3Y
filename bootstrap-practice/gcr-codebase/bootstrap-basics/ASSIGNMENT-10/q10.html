<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Agency Showcase</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q10.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>Explore the World</h1>
        <p class="mb-0">Your Journey Begins Here</p>
    </header>

    <main>

        <!-- Bootstrap Carousel -->
        <section>

            <div id="travelCarousel"
                class="carousel slide"
                data-bs-ride="carousel">

                <div class="carousel-inner">

                    <!-- Slide 1 -->
                    <div
                        class="carousel-item active"
                        data-bs-interval="3000">

                        <img
                            src="https://picsum.photos/1200/500?random=30"
                            class="d-block w-100"
                            alt="Paris">

                        <div class="carousel-caption">
                            <h2>Paris</h2>
                            <p>Experience the beauty of the City of Lights.</p>
                        </div>

                    </div>

                    <!-- Slide 2 -->
                    <div
                        class="carousel-item"
                        data-bs-interval="4000">

                        <img
                            src="https://picsum.photos/1200/500?random=31"
                            class="d-block w-100"
                            alt="Bali">

                        <div class="carousel-caption">
                            <h2>Bali</h2>
                            <p>Relax among beautiful beaches and nature.</p>
                        </div>

                    </div>

                    <!-- Slide 3 -->
                    <div
                        class="carousel-item"
                        data-bs-interval="5000">

                        <img
                            src="https://picsum.photos/1200/500?random=32"
                            class="d-block w-100"
                            alt="Switzerland">

                        <div class="carousel-caption">
                            <h2>Switzerland</h2>
                            <p>Discover mountains, lakes and scenic views.</p>
                        </div>

                    </div>

                </div>

                <!-- Previous button -->
                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="prev">

                    <span class="carousel-control-prev-icon"></span>

                </button>

                <!-- Next button -->
                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide="next">

                    <span class="carousel-control-next-icon"></span>

                </button>

            </div>

        </section>

        <!-- Booking progress -->
        <section class="container py-5">

            <h2 class="text-center mb-3">
                Booking Completion
            </h2>

            <div class="progress" role="progressbar"
                aria-label="Booking completion"
                aria-valuenow="70"
                aria-valuemin="0"
                aria-valuemax="100">

                <div
                    class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    style="width: 70%">

                    70%

                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-4">

        <h2 class="h5">Contact Us</h2>

        <p class="mb-1">
            Email: travel@example.com
        </p>

        <p class="mb-0">
            Phone: +91 98765 43210
        </p>

    </footer>

    <!-- Bootstrap 5 JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
