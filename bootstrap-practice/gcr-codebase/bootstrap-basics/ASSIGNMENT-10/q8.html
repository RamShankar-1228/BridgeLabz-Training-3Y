<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <header class="text-center py-5">
        <h1>Choose Your Plan</h1>

        <p class="lead">
            Select the plan that works best for your business.
        </p>
    </header>

    <main class="container pb-5">

        <section>

            <div class="row g-4">

                <!-- Basic Plan -->
                <div class="col-md-4">

                    <article class="card pricing-card h-100 text-center">

                        <div class="card-body p-4">

                            <h2>Basic</h2>

                            <h3 class="display-6 fw-bold">
                                ₹499
                            </h3>

                            <ul class="list-unstyled my-4">
                                <li class="mb-2">5 Projects</li>
                                <li class="mb-2">5 GB Storage</li>
                                <li class="mb-2">Email Support</li>
                            </ul>

                            <button class="btn btn-outline-primary">
                                Choose Plan
                            </button>

                        </div>

                    </article>

                </div>

                <!-- Pro Plan -->
                <div class="col-md-4">

                    <article class="card pricing-card bg-primary text-white h-100 text-center">

                        <div class="card-body p-4">

                            <h2>Pro</h2>

                            <h3 class="display-6 fw-bold">
                                ₹999
                            </h3>

                            <ul class="list-unstyled my-4">
                                <li class="mb-2">Unlimited Projects</li>
                                <li class="mb-2">50 GB Storage</li>
                                <li class="mb-2">Priority Support</li>
                            </ul>

                            <button class="btn btn-light">
                                Choose Plan
                            </button>

                        </div>

                    </article>

                </div>

                <!-- Premium Plan -->
                <div class="col-md-4">

                    <article class="card pricing-card h-100 text-center">

                        <div class="card-body p-4">

                            <h2>Premium</h2>

                            <h3 class="display-6 fw-bold">
                                ₹1499
                            </h3>

                            <ul class="list-unstyled my-4">
                                <li class="mb-2">Unlimited Projects</li>
                                <li class="mb-2">100 GB Storage</li>
                                <li class="mb-2">24/7 Support</li>
                            </ul>

                            <button class="btn btn-outline-primary">
                                Choose Plan
                            </button>

                        </div>

                    </article>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
