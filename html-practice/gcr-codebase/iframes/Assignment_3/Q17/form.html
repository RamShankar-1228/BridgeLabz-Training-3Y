<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>

    <h1>Submit Form</h1>

    <form action="result.html" target="resultFrame">

        width="500"
        height="150"
        title="Result">
    </iframe>

</html>
