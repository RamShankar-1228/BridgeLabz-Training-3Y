<!DOCTYPE html>
<html lang="en">

<head>

    <!-- title defines the title of the webpage -->
    <title>My Complete Webpage</title>

    <!-- meta provides information about the webpage -->
    <meta charset="UTF-8">
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">
    <meta
        name="author"
        content="Ram Shankar Singh">

    <!-- base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link connects an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style contains CSS styles -->
    <style>
    </style>

    <!-- script is used to add JavaScript -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This page demonstrates the important elements used inside
        the HTML head section.
    </p>

</body>
</html>
