<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Combining multiple inline elements -->
    <p>
        <strong>Welcome!</strong> Learning
        <em>HTML</em> is <mark>fun</mark> and useful.<br>
        <small>Keep learning every day.</small>
    </p>

</body>
</html>
