<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>

<body>

    <!-- School Name -->
    <h1>ABC Public School</h1>

    <!-- Student Report Table -->
    <table border="1" title="Student Marks Report">

        <!-- Table Heading -->
        <tr>
            <th rowspan="2">Student Name</th>
            <th colspan="5">Subjects</th>
            <th rowspan="2">Result</th>
        </tr>

        <tr>
            <th>English</th>
            <th>Maths</th>
            <th>Science</th>
            <th>Computer</th>
            <th>Social Science</th>
        </tr>

        <!-- Student Marks -->
        <tr>
            <td>Rahul</td>
            <td>80</td>
            <td>85</td>
            <td>78</td>
            <td>90</td>
            <td>82</td>
            <td>Pass</td>
        </tr>

        <tr>
            <td>Aman</td>
            <td>75</td>
            <td>88</td>
            <td>80</td>
            <td>85</td>
            <td>79</td>
            <td>Pass</td>
        </tr>

        <!-- Total and Percentage -->
        <tr>
            <th colspan="7">Total: ________ &nbsp;&nbsp;&nbsp; Percentage: ________</th>
        </tr>

    </table>

</body>

</html>
