<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>

<body>

    <!-- Product Catalog Heading -->
    <h1>Online Store - Product Catalog</h1>

    <!-- Product Table -->
    <table border="1">

        <!-- Table Heading -->
        <tr>
            <th colspan="5">Product Catalog</th>
        </tr>

        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <!-- Product 1 -->
        <tr>
            <td>Laptop</td>
            <td>
                <img src="laptop.avif" alt="Laptop" width="100">
            </td>
            <td>High-performance laptop for students.</td>
            <td>₹50,000</td>
            <td rowspan="2">Available</td>
        </tr>

        <!-- Product 2 -->
        <tr>
            <td>Smartphone</td>
            <td>
                <img src="smartphone.webp" alt="Smartphone" width="100">
            </td>
            <td>Modern smartphone with a good camera.</td>
            <td>₹25,000</td>
        </tr>

        <!-- Product 3 -->
        <tr>
            <td>Headphones</td>
            <td>
                <img src="headphone.avif" alt="Headphones" width="100">
            </td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,000</td>
            <td>Out of Stock</td>
        </tr>

    </table>

</body>

</html>
