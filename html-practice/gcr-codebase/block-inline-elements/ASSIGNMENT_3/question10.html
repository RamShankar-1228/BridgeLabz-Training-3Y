<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>

<body>

    <!-- Page Heading -->
    <h1>Travel Selection Page</h1>

    <!-- Country Dropdown -->
    <label for="country">Country:</label>

    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
    </select>

    <br><br>

    <!-- State Dropdown -->
    <label for="state">State:</label>

    <select id="state" name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <!-- City Dropdown -->
    <label for="city">City:</label>

    <select id="city" name="city">
        <option value="jhansi" selected>Jhansi</option>
        <option value="lucknow">Lucknow</option>
        <option value="agra">Agra</option>
    </select>

    <br><br>

    <!-- Favorite Tourist Place Dropdown -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place" name="place">
        <option value="tajmahal" selected>Taj Mahal</option>
        <option value="redfort">Red Fort</option>
        <option value="gateway">Gateway of India</option>
    </select>

    <br><br>

    <!-- Summary of Choices -->
    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Jhansi, and my favorite tourist place is Taj Mahal.
    </p>

</body>

</html>
