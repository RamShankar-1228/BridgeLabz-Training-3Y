<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
</head>

<body>

    <!-- Movie Database Table -->
    <table border="1" title="Movie Database">

        <!-- Caption -->
        <caption>
            <h1>Movie Database</h1>
        </caption>

        <!-- Table Heading -->
        <tr>
            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>
        </tr>

        <!-- Movie 1 -->
        <tr>
            <td>3 Idiots</td>
            <td>Comedy</td>
            <td>2009</td>
            <td>8.4</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <!-- Movie 2 -->
        <tr>
            <td>Inception</td>
            <td>Sci-Fi</td>
            <td>2010</td>
            <td>8.8</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <!-- Movie 3 -->
        <tr>
            <td>Interstellar</td>
            <td>Sci-Fi</td>
            <td>2014</td>
            <td>8.7</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <!-- Note at the Bottom -->
        <tr>
            <td colspan="5">
                <small>
                    Note: IMDB ratings may change over time.
                </small>
            </td>
        </tr>

    </table>

</body>

</html>
