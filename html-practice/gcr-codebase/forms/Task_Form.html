<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: #f8dddd;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .container {
            width: 500px;
            margin: 10px auto;
        }

        h2 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 20px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 5px;
        }

        td:first-child {
            width: 130px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select,
        textarea {
            width: 270px;
            height: 25px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            height: 40px;
            resize: none;
        }

        .name {
            width: 82px !important;
        }

        .date {
            width: 55px !important;
        }

        .phone {
            width: 25px !important;
        }

        .phone-number {
            width: 235px !important;
        }

        input[type="radio"] {
            margin-left: 0;
        }

        input[type="file"] {
            font-size: 11px;
        }

        .register {
            text-align: center;
        }

        button {
            font-size: 9px;
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form>

        <table>

            <tr>
                <td>Roll no. :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" class="name" placeholder="First Name">
                    -
                    <input type="text" class="name" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" class="date" placeholder="Day">
                    -
                    <input type="text" class="date" placeholder="Month">
                    -
                    <input type="text" class="date" placeholder="Year">
                    &nbsp; (DD-MM-YYYY)
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" class="phone" value="+91">
                    -
                    <input type="tel" class="phone-number">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="email">
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>---------------- Select Current Course's ----------------</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>M.Tech</option>
                        <option>BBA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="register">
                    <button type="submit">Register</button>
                </td>
            </tr>

        </table>

    </form>

</div>

</body>
</html>
