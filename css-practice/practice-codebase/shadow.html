<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS SHADOW</title>
 
  <style>
    .container {
      background-color: beige;
      height: 650px;
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
 
    .box {
      background-color: aqua;
      width: 330px;
      height: 330px;
      border: 3px solid brown;
      margin: 5px;
      padding: 5px;
      box-shadow: 10px 15px 50px 10px red;
    }
  </style>
</head>
 
<body>
 
  <div class="container">
    <div class="box">
 
      <img src="https://economictimes.indiatimes.com/photo/70342652.cms" alt="Bridge Labz Logo" width="100">
 
      <h2>Welcome to Bridge Labz</h2>
 
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </p>
 
    </div>
  </div>
 
</body>
</html>
