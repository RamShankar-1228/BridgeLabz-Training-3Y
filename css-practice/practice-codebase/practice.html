<!DOCTYPE html>
<html>
<head>
    <title>4 Flexbox</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 600px) {
            .container {
                flex-direction: row;
            }
        }
            @media (max-width: 600px) {
                .container {
                    flex-direction: column;
                }
        }
    </style>
</head>

<body>

    <h2>Four Flexbox</h2>

    <div class="container">

        <div class="box">Flexbox 1</div>
        <div class="box">Flexbox 2</div>
        <div class="box">Flexbox 3</div>
        <div class="box">Flexbox 4</div>

    </div>

</body>
</html>
