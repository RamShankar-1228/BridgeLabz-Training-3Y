<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link rel="stylesheet" href="Q5.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <!-- Pricing container -->
    <div class="pricing">

        <!-- Basic Plan -->
        <div class="plan">
            <h2>Basic</h2>

            <p class="price">₹199 / month</p>

            <ul>
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>10 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <!-- Standard Plan -->
        <div class="plan popular">
            <h2>Standard</h2>

            <p class="price">₹399 / month</p>

            <ul>
                <li>15 Projects</li>
                <li>Priority Support</li>
                <li>50 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <!-- Premium Plan -->
        <div class="plan">
            <h2>Premium</h2>

            <p class="price">₹699 / month</p>

            <ul>
                <li>Unlimited Projects</li>
                <li>Premium Support</li>
                <li>100 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

    </div>

</body>
</html>
