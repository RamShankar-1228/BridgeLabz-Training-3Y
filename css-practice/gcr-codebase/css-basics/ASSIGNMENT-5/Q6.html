<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <link rel="stylesheet" href="Q6.css">
</head>
<body>

    <h1>My Photo Gallery</h1>

    <!-- Photo Gallery -->
    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1018/500/350" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1025/500/350" alt="Animal">
            <div class="caption">Cute Animal</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1035/500/350" alt="River">
            <div class="caption">Peaceful River</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1043/500/350" alt="Landscape">
            <div class="caption">Beautiful Landscape</div>
        </div>

    </div>

</body>
</html>
