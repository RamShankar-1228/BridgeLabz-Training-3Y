<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards with Media Queries</title>

    <link rel="stylesheet" href="responsive-cards-with-media-queries.css">
</head>
<body>

    <header>
        <h1>Responsive Cards</h1>
    </header>

    <main>
        <section class="cards">

            <article class="card">
                <h2>Card 1</h2>
                <p>First responsive card.</p>
            </article>

            <article class="card">
                <h2>Card 2</h2>
                <p>Second responsive card.</p>
            </article>

            <article class="card">
                <h2>Card 3</h2>
                <p>Third responsive card.</p>
            </article>

            <article class="card">
                <h2>Card 4</h2>
                <p>Fourth responsive card.</p>
            </article>

        </section>
    </main>

</body>
</html>
