<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>

    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header>
        <h1>Before and After Filter</h1>
    </header>

    <main>
        <section class="comparison">

            <figure class="image-box">
                <img src="https://picsum.photos/id/1015/600/400" alt="Original image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure class="image-box">
                <img class="filtered" src="https://picsum.photos/id/1015/600/400" alt="Filtered image">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
