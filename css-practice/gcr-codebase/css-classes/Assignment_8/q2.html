<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <h1>CSS Tooltip Demonstration</h1>

    <main class="tooltip-container">

        <div class="tooltip-box">
            Home
            <span class="tooltip-text">Go to Home</span>
        </div>

        <div class="tooltip-box">
            Search
            <span class="tooltip-text">Search for information</span>
        </div>

        <div class="tooltip-box">
            Profile
            <span class="tooltip-text">View your profile</span>
        </div>

    </main>

</body>
</html>
