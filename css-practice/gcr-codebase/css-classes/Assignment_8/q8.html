<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <h1>Box-Sizing Comparison</h1>

    <main class="comparison">

        <section class="box default-box">
            <h2>Default</h2>
            <p>
                The default box-sizing is content-box.
                Padding and border are added to the given width.
            </p>
        </section>

        <section class="box border-box">
            <h2>Border-box</h2>
            <p>
                With border-box, padding and border are included
                inside the given width.
            </p>
        </section>

    </main>

</body>
</html>
