<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header>
        <h1>Mini User Interface</h1>
    </header>

    <main>

        <section class="card">

            <img src="https://picsum.photos/200/120" alt="Sample image">

            <div class="content">

                <h2>Contact Us</h2>

                <form>

                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Enter your email">

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Mini User Interface</p>
    </footer>

</body>
</html>
