<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main class="pricing">

        <section class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>Basic features</p>
            <button>Choose Plan</button>
        </section>

        <section class="card featured">
            <h2>Pro</h2>
            <h3>₹999</h3>
            <p>All popular features</p>
            <button>Choose Plan</button>
        </section>

        <section class="card">
            <h2>Premium</h2>
            <h3>₹1499</h3>
            <p>Advanced features</p>
            <button>Choose Plan</button>
        </section>

    </main>

</body>
</html>
