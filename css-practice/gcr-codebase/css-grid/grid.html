<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        .container{
            height:100%;
            width:100%;
            background-color:rgb(238, 59, 166);
            display:grid;
            padding:4rem;
            row-gap:1rem;
            column-gap:1rem;
            grid-template-rows:repeat(2,fr);
            grid-template-columns:1fr 1fr 1fr;
        }
        .items{
            background-color:rgb(59, 217, 238);
            border:4px solid white;
            color:blue;
            border-radius:1rem;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:2rem;
        }
        .header,.footer{
            grid-column-start:1;
            grid-column-end:4;
        }
        .sidebar{
            grid-row-start:2;
            grid-row-end:4;
        }
        .content1{
            grid-column-start:2;
            grid-column-end:4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items header">Header</div>
        <div class="items sidebar">Sidebar</div>
        <div class="items content1">Content1</div>
        <div class="items content2">Content2</div>
        <div class="items content3">Content3</div>
        <div class="items footer">Footer</div>
    </div>
</body>
</html>
