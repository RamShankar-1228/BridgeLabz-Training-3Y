<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <form>

        <h1>Contact Form</h1>

        <label for="name">Name</label>
        <input id="name" type="text" class="solid" placeholder="Enter your name">

        <label for="email">Email</label>
        <input id="email" type="email" class="dashed" placeholder="Enter your email">

        <label for="message">Message</label>
        <textarea id="message" class="double" placeholder="Enter your message"></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
