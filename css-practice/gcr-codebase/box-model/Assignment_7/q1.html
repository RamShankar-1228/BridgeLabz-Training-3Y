<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="boxes">
        <div class="box solid">
            <h2>Solid Border</h2>
            <p>Padding: 15px</p>
        </div>

        <div class="box dashed">
            <h2>Dashed Border</h2>
            <p>Padding: 20px</p>
        </div>

        <div class="box double">
            <h2>Double Border</h2>
            <p>Padding: 25px</p>
        </div>

        <div class="box groove">
            <h2>Groove Border</h2>
            <p>Padding: 30px</p>
        </div>
    </div>

</body>
</html>
