<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <div class="container">

        <div class="box box1">
            <h2>Box 1</h2>
            <p>Width: 180px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box box2">
            <h2>Box 2</h2>
            <p>Width: 50%</p>
            <p>Height: 30vh</p>
        </div>

        <div class="box box3">
            <h2>Box 3</h2>
            <p>This box demonstrates minimum height, maximum width and overflow.</p>
            <p>Extra content is added to demonstrate overflow behavior.</p>
        </div>

    </div>

</body>
</html>
